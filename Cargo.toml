[workspace]
resolver = "2"
members = [
    "crates/hub-core",
    "crates/hub-storage-sqlite",
    "crates/hub-crypto",
    "crates/hub-api",
    "crates/hub-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license-file = "LICENSE"
publish = false
repository = "https://github.com/Levix-Digital/levix-admin-hub"

[workspace.dependencies]
hub-core = { path = "crates/hub-core" }
hub-storage-sqlite = { path = "crates/hub-storage-sqlite" }
hub-crypto = { path = "crates/hub-crypto" }
hub-api = { path = "crates/hub-api" }

anyhow = "1"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
clap = { version = "4", features = ["derive", "env"] }
rand = "0.8"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["request-id", "trace", "limit", "timeout", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
