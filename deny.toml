# Supply chain policy (TECH_SPEC, Constraints): permissive licenses only, no known
# advisories, crates only from crates.io.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` (macro crate, compile time only) is unmaintained but has no vulnerability; it
    # reaches the console through Leptos. Revisit when Leptos drops it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time macro, no known vulnerability" },
    # Bundled SQLite before 3.54.0 (libsqlite3-sys 0.30 through sqlx-sqlite 0.8): no sqlx
    # release allows the patched libsqlite3-sys 0.39 yet. The Hub only opens its own database
    # on its data volume, so the attack needs write access to that volume. Tracked as BUG-001
    # in docs/BACKLOG.md. Review by 2027-02-11: remove once fixed, or decide again.
    { id = "RUSTSEC-2026-0459", reason = "no compatible fix in sqlx yet; local attack needs write access to the data volume; BUG-001, review by 2027-02-11" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9
# Permissive licenses accepted only for the crates that need them (the web console's framework).
exceptions = [
    { allow = ["BSL-1.0"], crate = "xxhash-rust" },
    { allow = ["CC0-1.0"], crate = "base16" },
]

[licenses.private]
# The workspace crates are proprietary (LICENSE) and never published.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
