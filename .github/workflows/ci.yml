# Pull request checks (trunk model: pull requests into main, pushes to main).
name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace --locked
      - name: No HTTP client in the server (ADR-0004)
        run: |
          if cargo tree -p hub-server -e normal --prefix none | grep -E '^(reqwest|ureq|isahc|surf|attohttpc) '; then
            echo "The Hub server must not depend on an HTTP client." >&2
            exit 1
          fi

  console:
    name: Console (build, browser flows, accessibility)
    runs-on: ubuntu-latest
    env:
      TRUNK_VERSION: v0.22.1
      TRUNK_SHA256: 2ab8d548fd5ed9cda50906f61fd8654204e7893bd52ebbfd90533862b7d71ee1
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        run: |
          curl -sSfL -o trunk.tar.gz "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TRUNK_SHA256}  trunk.tar.gz" | sha256sum -c
          tar xzf trunk.tar.gz -C /usr/local/bin trunk
      - name: Clippy for the browser target
        run: cargo clippy -p hub-console --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build the console
        working-directory: crates/hub-console
        run: trunk build --release --locked
      - name: Build the server with the console embedded
        run: cargo build --locked -p hub-server
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the browser test tools
        working-directory: console-tests
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser flows and axe-core in en, fr and es
        run: console-tests/run.sh target/debug/levix-hub

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  contract:
    name: Contract (breaking changes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the channel specification (AsyncAPI 3.0)
        run: |
          npx --yes @asyncapi/cli@2.16.0 config analytics --disable
          npx --yes @asyncapi/cli@2.16.0 validate docs/contracts/channel/v1/asyncapi.json --fail-severity error
      - name: Compare the API contract with the last release
        env:
          # oasdiff v1.34.1, pinned by digest.
          OASDIFF: tufin/oasdiff@sha256:67a23cfea7d251e2ae34ee703ac8733c5d96bc2e7b90fd0f4d475ec99367b85f
          CONTRACT: docs/contracts/api/openapi.json
        run: |
          base_tag=$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-rc' | head -n 1)
          if [ -z "$base_tag" ] || ! git cat-file -e "$base_tag:$CONTRACT" 2>/dev/null; then
            echo "No released contract yet: nothing to compare."
            exit 0
          fi
          git show "$base_tag:$CONTRACT" > base.json
          major() { python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["info"]["version"].split(".")[0])' "$1"; }
          if [ "$(major base.json)" != "$(major "$CONTRACT")" ]; then
            echo "Contract major version changed since $base_tag: breaking changes are allowed."
            exit 0
          fi
          docker run --rm -v "$PWD:/w" -w /w "$OASDIFF" breaking base.json "$CONTRACT" --fail-on ERR

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f deploy/Containerfile -t levix-hub:ci .
      - name: Start, check readiness under 10 s, initialize
        run: |
          docker run -d --name hub -p 8443:8443 levix-hub:ci
          start=$(date +%s)
          until curl -skf https://127.0.0.1:8443/healthz >/dev/null; do
            if [ $(( $(date +%s) - start )) -ge 10 ]; then
              echo "The Hub was not ready within 10 s" >&2
              docker logs hub
              exit 1
            fi
            sleep 0.2
          done
          echo "Ready after $(( $(date +%s) - start )) s"
          curl -skf https://127.0.0.1:8443/api/v1/instance | grep -q '"initialized":false'
          docker exec hub levix-hub init --owner-email owner@example.com | tee init.txt
          grep -q '#/link/lvxl_' init.txt
          curl -skf https://127.0.0.1:8443/api/v1/instance | grep -q '"initialized":true'
          curl -skf https://127.0.0.1:8443/readyz | grep -q '"ready"'
          docker exec hub levix-hub audit verify
      - name: Logs
        if: always()
        run: docker logs hub || true
