# Pull request checks (trunk model: pull requests into main, pushes to main).
name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace --locked
      - name: No HTTP client in the server (ADR-0004)
        run: |
          if cargo tree -p hub-server -e normal --prefix none | grep -E '^(reqwest|ureq|isahc|surf|attohttpc) '; then
            echo "The Hub server must not depend on an HTTP client." >&2
            exit 1
          fi

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f deploy/Containerfile -t levix-hub:ci .
      - name: Start, check readiness under 10 s, initialize
        run: |
          docker run -d --name hub -p 8443:8443 levix-hub:ci
          start=$(date +%s)
          until curl -skf https://127.0.0.1:8443/healthz >/dev/null; do
            if [ $(( $(date +%s) - start )) -ge 10 ]; then
              echo "The Hub was not ready within 10 s" >&2
              docker logs hub
              exit 1
            fi
            sleep 0.2
          done
          echo "Ready after $(( $(date +%s) - start )) s"
          curl -skf https://127.0.0.1:8443/api/v1/instance | grep -q '"initialized":false'
          docker exec hub levix-hub init
          curl -skf https://127.0.0.1:8443/api/v1/instance | grep -q '"initialized":true'
          curl -skf https://127.0.0.1:8443/readyz | grep -q '"ready"'
      - name: Logs
        if: always()
        run: docker logs hub || true
