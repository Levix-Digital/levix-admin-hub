# Release workflow: builds and publishes a release for a version tag.
# - vX.Y.Z-rc.N tags (pushed on main for a release candidate) publish a PRE-RELEASE.
# - vX.Y.Z final tags are created by promote.yml (Levi's release gate), which calls this
#   workflow directly (a tag pushed with GITHUB_TOKEN would not trigger it).
# Assets: the container image for x86_64 and arm64 (OCI archives, for air-gapped hosts too),
# the CLI for Linux, macOS and Windows, CycloneDX SBOMs and SHA256SUMS.txt.
name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: Tag to build and publish
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  image:
    name: Container image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build the image (console embedded)
        run: docker build -f deploy/Containerfile -t "levix-hub:${TAG#v}" .
      - name: Check that it starts and becomes ready
        run: |
          docker run -d --name hub -p 8443:8443 "levix-hub:${TAG#v}"
          for _ in $(seq 50); do curl -sfk https://localhost:8443/readyz && break; sleep 0.2; done
          curl -sfk https://localhost:8443/readyz
          curl -sfk https://localhost:8443/ | grep -q '<script type="module">'
          docker rm -f hub
      - name: Export the image
        run: |
          mkdir -p dist
          docker save "levix-hub:${TAG#v}" | gzip -9 > "dist/levix-hub-${TAG}-linux-${{ matrix.arch }}.oci.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  cli:
    name: CLI (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest, archive: tar.gz }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, archive: tar.gz }
          - { name: macos-arm64, runner: macos-latest, archive: tar.gz }
          - { name: windows-x86_64, runner: windows-latest, archive: zip }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install the toolchain from rust-toolchain.toml
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      # The end-to-end tests run in CI on Linux; here the unit and contract parity tests run on
      # each platform the binary is built for.
      - name: Test the CLI
        shell: bash
        run: cargo test --locked -p hub-cli --lib --test parity
      - name: Build
        shell: bash
        run: cargo build --release --locked -p hub-cli
      - name: Package
        shell: bash
        run: |
          mkdir -p dist package
          base="levix-hub-cli-${TAG}-${{ matrix.name }}"
          if [ "${{ matrix.archive }}" = zip ]; then
            cp target/release/levix-hub-cli.exe package/
            cp LICENSE package/
            (cd package && 7z a "../dist/${base}.zip" .)
          else
            cp target/release/levix-hub-cli LICENSE package/
            tar -C package -czf "dist/${base}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.10 --locked
      - name: Generate
        run: |
          cargo cyclonedx --format json --spec-version 1.5
          mkdir -p dist
          for crate in hub-server hub-cli hub-console; do
            cp "crates/${crate}/${crate}.cdx.json" "dist/levix-${crate}-${TAG}.cdx.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [image, cli, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-rc') }}
          make_latest: ${{ contains(env.TAG, '-rc') && 'false' || 'legacy' }}
          generate_release_notes: true
          files: dist/*
