[package]
name = "hub-console"
description = "Web console of the Admin Hub: Leptos in the browser, over the public API only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
console_error_panic_hook = "0.1"
data-encoding.workspace = true
fluent-bundle = "0.16"
fluent-syntax = "0.12"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = "0.3"
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde_json.workspace = true
unic-langid = "0.9"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Storage", "Window", "Navigator", "Document", "Location", "HtmlElement", "HtmlDocument"] }

[lints]
workspace = true
